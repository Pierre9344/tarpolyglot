# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Coverage is measured with the live integration tests ENABLED. Most of this
# package is code that only runs with a real interpreter or compiler present
# (the run_*_step() workers, the fresh-worker checks in toolchain_check(), the
# Python/Julia output redirection in log.R). Without TARPOLYGLOT_INTEGRATION
# every one of those tests skips and coverage reports ~82% against code that is
# in fact exercised, so this job installs the same toolchains as
# tarpolyglot-integration.yaml and sets the same env var.
on:
  push:
    branches: [main, dev]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TARPOLYGLOT_INTEGRATION: "true"
      JULIA_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # --- Python (reticulate) ---
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Point reticulate at the setup Python
        shell: Rscript {0}
        run: |
          python <- Sys.which("python")
          if (!nzchar(python)) stop("python is not on PATH")
          python <- normalizePath(python, winslash = "/", mustWork = TRUE)
          cat("RETICULATE_PYTHON=", python, "\n",
              sep = "", file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          cat("RETICULATE_PYTHON =", python, "\n")

      # --- Julia (JuliaCall discovers it on PATH) ---
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.10.11"

      # --- Rust (rextendr/extendr) ---
      - uses: dtolnay/rust-toolchain@stable

      # --- R package dependencies ---
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            any::remotes
          needs: coverage

      # CRAN currently provides JuliaCall 0.17.6, which predates the Ubuntu 24.04
      # libunwind fixes; see tarpolyglot-integration.yaml for the full rationale.
      - name: Install JuliaCall with the Ubuntu libunwind fixes
        shell: Rscript {0}
        run: |
          remotes::install_github(
            "JuliaInterop/JuliaCall@947d1f3",
            dependencies = FALSE,
            upgrade = "never",
            build_vignettes = FALSE,
            force = TRUE
          )
          cat("JuliaCall version:", packageDescription("JuliaCall")$Version, "\n")

      - name: Toolchain diagnostics
        shell: Rscript {0}
        run: |
          cat("R:", R.version.string, "\n")
          cat("Python:", Sys.which("python"), "\n")
          cat("Julia:", Sys.which("julia"), "\n")
          cat("Cargo:", Sys.which("cargo"), "\n")
          cat("TARPOLYGLOT_INTEGRATION =",
              Sys.getenv("TARPOLYGLOT_INTEGRATION"), "\n")

      # Build RCall.jl against this exact R *before* the coverage run, exactly as
      # tarpolyglot-integration.yaml does. Without it the first julia_setup()
      # happens inside the test suite, where several tests can trigger the
      # precompile at once and it fails with
      #   "Failed to precompile RCall ... to ~/.julia/compiled/v1.10/RCall/jl_XXXX"
      # Doing it here once also surfaces a Julia problem as its own failed step
      # rather than buried in testthat.Rout.fail.
      - name: Julia / JuliaCall diagnostics (pre-build RCall.jl)
        shell: Rscript {0}
        run: |
          cat("julia on PATH:", Sys.which("julia"), "\n")
          system2("julia", "--version")
          cat("JuliaCall:", as.character(packageVersion("JuliaCall")), "\n")

          JuliaCall::julia_setup(
            installJulia = FALSE,
            rebuild = TRUE,
            verbose = TRUE
          )

          result <- JuliaCall::julia_eval("1 + 1")
          cat("JuliaCall julia_eval(1 + 1) =", result, "\n")

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
