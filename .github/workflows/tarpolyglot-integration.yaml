# Live polyglot integration tests. Unlike R-CMD-check.yaml (which never runs the
# env-gated tests), this installs real Python, Julia, and Rust toolchains and sets
# TARPOLYGLOT_INTEGRATION=true so the reticulate / JuliaCall / rextendr round-trips
# in tests/testthat/test-integration-*.R and test-inline-*.R actually execute.
on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

name: tarpolyglot-integration.yaml

permissions: read-all

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ${{ matrix.config.os }}
    name: integration ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          # ubuntu-latest is Ubuntu 24.04, where CRAN JuliaCall 0.17.6 segfaults
          # (a libunwind bug, JuliaCall #265/#282); the "Install JuliaCall with the
          # Ubuntu libunwind fixes" step below pins a patched revision to work
          # around it. This combination passes here.
          #
          # Ubuntu 26.04 does NOT have that segfault: CRAN JuliaCall works there
          # unpatched, verified locally in WSL (Ubuntu 26.04). We tried switching
          # this job to the `ubuntu-26.04` GitHub-hosted runner to drop the pinned
          # JuliaCall, but that run FAILED on GitHub Actions (ubuntu-26.04 is still
          # a Preview image, no Actions SLA) even though the same OS version is
          # green under WSL. So the failure is specific to the GitHub-hosted
          # preview runner, not to Ubuntu 26.04 itself. Stay on ubuntu-latest until
          # ubuntu-latest becomes 26.04 (then the pinned-JuliaCall step can go).
          - {os: ubuntu-latest}
          - {os: windows-latest}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      TARPOLYGLOT_INTEGRATION: "true"
      JULIA_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v6

      # --- R and Pandoc ---
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          # Pin the version so this integration job does not change underneath us.
          r-version: "4.6.1"
          use-public-rspm: true

      # --- Python (reticulate) ---
      # v6 uses the Node.js 24 action runtime.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Point reticulate at the setup Python
        shell: Rscript {0}
        run: |
          python <- Sys.which("python")
          if (!nzchar(python)) stop("python is not on PATH")
          python <- normalizePath(python, winslash = "/", mustWork = TRUE)
          cat("RETICULATE_PYTHON=", python, "\n",
              sep = "", file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          cat("RETICULATE_PYTHON =", python, "\n")

      # --- Julia (JuliaCall discovers it on PATH) ---
      # v3 uses the Node.js 24 action runtime. Pin the latest Julia 1.10 LTS patch.
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.10.11"

      # --- Rust (rextendr/extendr) ---
      - uses: dtolnay/rust-toolchain@stable

      # rextendr keeps the normal MSVC host toolchain on Windows, but requires the
      # GNU compilation target to match R/Rtools' MinGW ABI.
      - name: Add the Rust GNU target on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: rustup target add x86_64-pc-windows-gnu

      # --- R package dependencies ---
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::pkgload
            any::remotes
          needs: check

      # CRAN currently provides JuliaCall 0.17.6, which predates the Ubuntu 24.04
      # libunwind fixes. This pinned upstream revision contains both fixes:
      #   - preload Julia's bundled libunwind in the parent R process (#265)
      #   - pass that preload to Julia child processes (#282)
      # Do not replace this with an LD_PRELOAD of the system libstdc++ library.
      - name: Install JuliaCall with the Ubuntu libunwind fixes
        shell: Rscript {0}
        run: |
          remotes::install_github(
            "JuliaInterop/JuliaCall@947d1f3",
            dependencies = FALSE,
            upgrade = "never",
            build_vignettes = FALSE,
            force = TRUE
          )

          desc <- packageDescription("JuliaCall")
          cat("JuliaCall version:", desc$Version, "\n")
          cat(
            "JuliaCall revision:",
            if (is.null(desc$RemoteSha)) "<not recorded>" else desc$RemoteSha,
            "\n"
          )

      - name: Toolchain diagnostics
        shell: Rscript {0}
        run: |
          cat("R:", R.version.string, "\n")
          cat("Platform:", R.version$platform, "\n")
          cat("Python:", Sys.which("python"), "\n")
          cat("Julia:", Sys.which("julia"), "\n")
          cat("Rustc:", Sys.which("rustc"), "\n")
          cat("Cargo:", Sys.which("cargo"), "\n")

          system2("python", "--version")
          system2("julia", "--version")
          system2("rustc", "-vV")
          system2("cargo", "--version")
          system2("rustup", c("target", "list", "--installed"))

          if (requireNamespace("rextendr", quietly = TRUE)) {
            rextendr::rust_sitrep()
          }

      # Diagnose JuliaCall separately, so an integration failure is not hidden in
      # the test runner. rebuild=TRUE ensures RCall.jl is built for this exact R.
      - name: Julia / JuliaCall diagnostics
        shell: Rscript {0}
        run: |
          cat("julia on PATH:", Sys.which("julia"), "\n")
          system2("julia", "--version")
          cat(
            "JuliaCall:",
            as.character(packageVersion("JuliaCall")),
            "\n"
          )

          JuliaCall::julia_setup(
            installJulia = FALSE,
            rebuild = TRUE,
            verbose = TRUE
          )

          result <- JuliaCall::julia_eval("1 + 1")
          cat("JuliaCall julia_eval(1 + 1) =", result, "\n")

      # `setup-r-dependencies` installs only the *dependencies*, and
      # `testthat::test_local()` below loads tarpolyglot with pkgload, i.e. as a
      # source tree in the main R process only. Two of the gated tests spawn a
      # fresh `callr::r()` subprocess that needs the tarpolyglot *namespace*
      # (`tarpolyglot::compile_rs_lib()` in test-integration-rust.R, and
      # `tarpolyglot:::.tp_with_rust_build_env()` inside toolchain_check()'s Rust
      # deep check). A fresh subprocess only sees `.libPaths()`, never the
      # pkgload-loaded source, so without this step it fails with
      # "there is no package called 'tarpolyglot'". Installing here puts the
      # package on `.libPaths()` for those subprocesses, which is also how it is
      # actually used in production (a crew worker reloads an installed package).
      - name: Install tarpolyglot itself (needed by the callr subprocess tests)
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")
          cat(
            "tarpolyglot", as.character(packageVersion("tarpolyglot")),
            "installed at", find.package("tarpolyglot"), "\n"
          )

      # --- Run the complete test suite, including live integration tests ---
      - name: Run tests (incl. live integration)
        shell: Rscript {0}
        run: |
          cat("TARPOLYGLOT_INTEGRATION =", Sys.getenv("TARPOLYGLOT_INTEGRATION"), "\n")
          cat("RETICULATE_PYTHON       =", Sys.getenv("RETICULATE_PYTHON"), "\n")
          cat("julia                   =", Sys.which("julia"), "\n")
          cat("cargo                   =", Sys.which("cargo"), "\n")

          if (!nzchar(Sys.getenv("RETICULATE_PYTHON"))) {
            stop("RETICULATE_PYTHON is not set")
          }
          if (!nzchar(Sys.which("julia"))) stop("julia is not on PATH")
          if (!nzchar(Sys.which("cargo"))) stop("cargo is not on PATH")

          testthat::test_local(
            ".",
            stop_on_failure = TRUE,
            reporter = "progress"
          )
