url: https://pierre9344.github.io/tarpolyglot/
template:
  bootstrap: 5
reference:
- title: Package overview
  contents: tarpolyglot-package
- title: Target constructors
  desc: |
    Build a targets step that runs Python, Julia, Rust, or C++. The non-`_raw` forms use non-standard evaluation on `name`/`pattern` for direct use in `_targets.R`; the `_raw` forms take a string `name` for use inside targets factories.
  contents:
  - tar_target_cpp
  - tar_target_cpp_raw
  - tar_target_py
  - tar_target_py_raw
  - tar_target_jl
  - tar_target_jl_raw
  - tar_target_rs
  - tar_target_rs_raw
- title: Helpers
  desc: |
    Supply a step's code inline, track a script file as a dependency, branch while compiling Rust or C++ once, and a crew controller preconfigured for per-step interpreter isolation.
  contents:
  - tar_code
  - tar_target_path
  - polyglot_controller
  - tar_polyglot_log
  - toolchain_check
- title: Branching patterns
  desc: |
    Dynamic-branching pattern helpers that mirror the `targets` patterns but compile once per pattern and reuse the result across branches: the Rust crate in a `<name>_rust_lib` target, the C++ library in a `<name>_cpp_lib` target. On the Python/Julia constructors they fall back to the plain `targets` pattern, since a live interpreter has nothing to compile.
  contents:
  - tarpolyglot_map
  - tarpolyglot_cross
  - tarpolyglot_slice
  - tarpolyglot_head
  - tarpolyglot_tail
  - tarpolyglot_sample
- title: Step workers
  desc: |
    Worker functions the constructors call at pipeline run time. Documented because the constructor pages link to them; you do not normally call them directly.
  contents:
  - run_cpp_step
  - run_py_step
  - run_jl_step
  - run_rs_step
  - compile_cpp_lib
  - run_cpp_step_prebuilt
  - compile_rs_lib
  - run_rs_step_prebuilt
articles:
- title: Guides
  navbar: ~
  contents:
  - get_started
  - scripts
  - python
  - julia
  - rust
  - cpp

